# Both [theme.light] and [theme.dark] are defined, so the settings menu offers
# "Use system setting" / "Light" / "Dark". Do NOT add colors to the bare [theme] table:
# a single [theme] with colors locks the app to one mode.

[theme]
font = "sans serif"

[theme.light]
primaryColor = "#C96442"
backgroundColor = "#FAF9F5"
secondaryBackgroundColor = "#F0EEE6"
textColor = "#1F1E1D"

[theme.light.sidebar]
backgroundColor = "#F0EEE6"
secondaryBackgroundColor = "#E8E5DA"

[theme.dark]
primaryColor = "#C96442"
backgroundColor = "#262624"
secondaryBackgroundColor = "#30302E"
textColor = "#ECEBE4"

[theme.dark.sidebar]
backgroundColor = "#1F1E1D"
secondaryBackgroundColor = "#30302E"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false